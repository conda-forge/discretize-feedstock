{% set version = "0.12.0" %}
context:
  # ensure is_freethreading gets detected as a used variable
  touch_is_freethreading: ${{ is_freethreading }}


package:
  name: discretize
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/discretize/discretize-{{ version }}.tar.gz
  sha256: 5b6fce19bd9e7a1d82db4ba7de41a95d178fc504a9169f6009bc2e3a386a8b44

build:
  number: 0
  skip: true #[py<311]

requirements:
  build:
    - python                                #[build_platform!=target_platform]
    - cross-python_${{ target_platform }}   #[build_platform!=target_platform]
    - cython                                #[build_platform!=target_platform]
    - ninja                                 #[build_platform!=target_platform]
    - numpy                                 #[build_platform!=target_platform]
    - pkg-config
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
  host:
    - pip
    - meson
    - meson-python
    - ninja
    - pkg-config
    - python
    - python-build
    - cython >=3.1.0
    - numpy
    - setuptools_scm >=6.2
  run:
    - python
    - numpy >=1.22.4
    - scipy >=1.12

test:
  imports:
    - discretize
  commands:
    - python -c "import discretize; print(discretize.__version__)"
    - python -c "from importlib.metadata import version; print(version('discretize'))"

about:
  home: http://github.com/simpeg/discretize
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Discretization tools for finite volume and inverse problems

extra:
  recipe-maintainers:
    - lheagy
    - jcapriot
